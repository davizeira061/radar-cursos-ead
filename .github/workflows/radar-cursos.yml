name: Radar Semanal de Cursos Gratuitos EAD

on:
  schedule:
    # Executa toda segunda-feira às 12:00 UTC (09:00 no horário de Brasília)
    - cron: '0 12 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: 'Forçar coleta completa (ignorar histórico anterior)?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  executar-radar:
    runs-on: ubuntu-latest
    name: 🛰️ Coletar & Atualizar Cursos

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Instalar Dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: 🚀 Executar Orquestrador PowerShell
        shell: pwsh
        run: |
          $params = @{}
          if ("${{ github.event.inputs.force }}" -eq "true") {
            $params["Force"] = $true
          }
          ./scripts/Invoke-CourseRadar.ps1 @params
